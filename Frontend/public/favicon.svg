<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0c14" />
      <stop offset="50%" stop-color="#111322" />
      <stop offset="100%" stop-color="#07080d" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#4338ca" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="topLoop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="bottomLoop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="116" fill="none" stroke="url(#borderGrad)" stroke-width="6" />
  <circle cx="256" cy="256" r="180" fill="url(#centerGlow)" />

  <g filter="url(#softGlow)">
    <path d="M 336 180 C 336 132 298 108 244 108 C 180 108 140 148 140 196 C 140 248 184 272 238 290 L 274 302"
          fill="none" stroke="url(#topLoop)" stroke-width="50" stroke-linecap="round" />
    <path d="M 176 332 C 176 380 214 404 268 404 C 332 404 372 364 372 316 C 372 264 328 240 274 222 L 238 210"
          fill="none" stroke="url(#bottomLoop)" stroke-width="50" stroke-linecap="round" />
    <circle cx="256" cy="256" r="14" fill="#ffffff" opacity="0.95" />
  </g>

  <g transform="translate(382, 126)">
    <path d="M 0 -38 Q 0 0 38 0 Q 0 0 0 38 Q 0 0 -38 0 Q 0 0 0 -38 Z" fill="url(#sparkGrad)" />
    <circle cx="0" cy="0" r="7" fill="#ffffff" />
  </g>
  <g transform="translate(126, 386) scale(0.4)">
    <path d="M 0 -38 Q 0 0 38 0 Q 0 0 0 38 Q 0 0 -38 0 Q 0 0 0 -38 Z" fill="#818cf8" opacity="0.85" />
  </g>
</svg>
